<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d130b" />
    <title>Firangi Tota</title>
    <link rel="preload" href="/fonts/mukta-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- the title lettering paints on the first screen -->
    <link rel="preload" href="/fonts/tiro-devanagari-hindi-400-devanagari.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/old-standard-tt-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- torn, deckled paper edges for the cards and documents (styles.css: filter: url(#ft-deckle)) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="ft-deckle" x="-4%" y="-4%" width="108%" height="108%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="stage"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
