<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lahore 1929 desk</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0806; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px;
        justify-content: center; font: 14px system-ui, sans-serif; }
      #bar button { min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #6b4a2a;
        background: #2a1a10; color: #f3dcb6; }
      body.shot #bar { display: none; }
    </style>
  </head>
  <body>
    <!-- Dev-only preview of the 3D stage with the lahore-1929 dressing. Not part of the build. -->
    <div id="stage"></div>
    <div id="bar">
      <button data-act="paper">Paper</button>
      <button data-act="asli">ASLI</button>
      <button data-act="tota">TOTA</button>
      <button data-act="caught">Caught</button>
    </div>
    <script type="module" src="./lahore1929.ts"></script>
  </body>
</html>
